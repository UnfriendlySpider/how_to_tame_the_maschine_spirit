# The talk deck: how each slide of slides/storyline.md is laid out.
#
#   uv run python tools/build_slides.py           build out/PRE_ML19.pptx; missing images become placeholders
#   uv run python tools/build_slides.py --list    which images are in slides/beats/ and which are missing
#   uv run python tools/build_slides.py --final   the same build, but it fails while anything is a placeholder
#
# Four sources, one job each:
#   storyline.md  the script: slide ids and titles, the image of each slide, the
#                 scene (printed on its placeholder) and the notes in bullets,
#                 the intention and the points of each slide (the speaker notes)
#   deck.yaml     this file: the layout of each slide and what its blocks show
#   beats/        the images: save one under its storyline name and rebuild
#   brand/        the logos
# Title, author line and paper number come from paper/metadata.yaml.
#
# Every slide id of the storyline has exactly one entry under `slides`, in the
# same order; the build stops on a slide that is missing or extra. Quote the
# ids, or YAML reads 1.1 as a number.
#
# The deck has two parts. The story is told in pictures: every story slide is
# a `picture`, the image edge to edge and nothing else on it. After the cast's
# goodbye and the closing slide, which stays up for the questions, come the
# beats that answer a question (beat 10) and the reference part, to read after
# the talk: one `reference` slide per mechanism, the paper's own sentences
# beside the files and commands the story is about.
#
# Layouts (every slide but the title and the pictures carries its title in the
# top left corner, and every slide but the title and the pictures a leaf with the
# slide number in the bottom left corner, as in ML04; the pictures keep their
# black and white: the number stands bottom right in black, without a leaf, and
# every generated image carries the AI label in its top right corner)
#   title      paper number, title, place and conference, name and e-mail, and the line
#              that explains the AI label; the logo top right, the earth bottom right
#              (no drawing since 2026-10-28: the house opens the story on 0.2)
#   picture    the whole slide is the image; its title sits just above the slide,
#              for the outline and screen readers, where the show never draws it
#   close      questions and contact on the left, the QR codes on the right
#   reference  `explain` blocks on the left without a card, `panel` blocks in a card
#              on the right; either alone takes the whole width
#   panel      the image as a 4:3 crop on the left, the panel on the right (not used now)
#   full       the whole 16:9 image below the title, an optional inset card (not used now)
#
# Slide options
#   split      reference: the left column's share of the width (default 0.45); panel: the
#              image's share (default 0.55). Lower it to widen the right-hand card
#   mechanism  reference: which of the seven leaves in the top right corner to light (1-7)
#   focus      [x, y]: the point of the image the crop centres on, from 0 to 1 (default [0.5, 0.5])
#   zoom       crop closer than the frame-filling crop (default 1)
#   inset      full: a card in a corner of the image, {corner, width, blocks}
#   rings      highlight rings drawn on the slide over the picture, [x, y, w, h] from 0 to 1;
#              as {at: [x, y, w, h], click: true} a ring waits for a click, and the rings that
#              wait pop up together on one click, after the labels that wait (not used now: 8.1
#              had them for a day, 2026-10-22, and the author points instead)
#   names      picture: the names that float above the cast, as in a game. Each entry has
#              `who` (an id under `cast`), `at` [x, y], the top of the head as shares of the
#              picture, and an optional `bar`, a share from 0 to 1 shown as a bar under the
#              name (beat 6: the context window); `burst: true` with `bar: 1` sends short lines
#              flying from the bar's end, and `text: false` keeps the bar alone. Not on a
#              zoomed slide
#   labels     picture: an object's Claude Code name in a thin box, `text` and `at` [x, y], the
#              middle of the label's lower edge; a "\n" in the text breaks it into lines. With
#              `click: true` it waits for a click and pops up, so it appears when the speaker
#              names it; several pop up in their order, and the notes name the clicks
#              (since 2026-10-20). Not on a slide with a build-up; `motion: false` shows them all
#   card       picture: the id of a robot under `cast` that joins the team on this slide, or of
#              the threat that comes in (its card carries its own `tag`). The next slide
#              repeats the picture under a white veil and sets the card on it, as a game shows
#              a new team member. Each joins once; the card fades in
#   beside     picture, with `card`: a robot already on the team whose card stands on the left of
#              the new one, the rows lined up, so the room compares the two
#   transition picture: `fade`, the slide fades in from the one before; for a fix that shares its
#              pain's camera, so the dissolve shows what the mechanism changes
#   build_up   picture: `stages`, earlier stages of the same picture, each on a slide of its own
#              before the slide itself; each stage is an `image` and the `bars` it shows by cast
#              id. Each waits for the click (since 2026-10-27; they moved on by themselves before)
#              and carries the slide's notes and a number; the later ones fade in from the one
#              before, and they stay without motion
#   steps      picture: the states a fix passes through, each on a slide of its own before the
#              slide itself, which shows the last (since 2026-10-22); each step is an `image`,
#              the `bars` it shows by cast id and its own `labels`, which stand from the start,
#              since the step is its own click. They carry the slide's notes and a number; the
#              first fades in with the slide's `transition`, and they stay without motion. A
#              state that changes a picture or a bar gets a step, not a click: one slide whose
#              clicks changed both did not play in PowerPoint as built
#   advance    picture: `after_gif` moves on to the next slide by itself, half a second after
#              the slide's GIF reaches its last frame; a click still moves on too. For a GIF
#              that plays once and ends on the next slide's picture, where a click would show
#              nothing (since 2026-10-29: 0.3 into 1.1, which took two clicks)
#   alt        picture: the alternative text a screen reader speaks, describing the picture as it
#              was finally drawn; without it the storyline's Scene serves, which stays the design
#              source of the image prompts. A stage of `build_up` and a step of `steps` take an
#              `alt` of their own, since each shows another picture
#   ai_label   the corner of the image that carries the AI label: top-right (the default,
#              the Code of Practice's example), top-left, bottom-left or bottom-right. The
#              build warns when the label would hide part of the drawing
#   ai_legend  title: one line that says what the AI label marks, beside the icon,
#              where the label first appears
#   ai_legend_narrated
#              title: the same line for the narrated deck, which replaces `ai_legend` there
#              (since 2026-10-28: its voice is generated too)
#
# Blocks, stacked from top to bottom
#   file        a repository file, quoted at build time. `lines` is a range ("46-53") or a
#               list of ranges; `expect` lists text the quoted lines must contain, so an
#               edit that moves them stops the build; `highlight` sets text in the accent
#               colour; `reflow: true` joins the wrapped lines of a Markdown list item;
#               `label` adds a word after the path
#   shell      a command, with an optional literal `output` and a `label`
#   code        literal monospaced lines, with an optional `highlight`
#   text, caption, label
#               prose; `code`, **bold** and *italic* work inside. `source` names a
#               file that must contain the quoted words; the paper's reference
#               numbers, "[4]", are left out of the comparison. `talk_only: true`
#               leaves a text or caption out of the narrated deck
#   bullets     a list of prose items
#   table       literal rows: `rows`, optional `header`, `bold` (row numbers from 1),
#               relative column `widths` and `row_headers: true` (first column bold)
#   table_from  rows read from a Markdown table: `file`, its `header`, the `columns`
#               and the `rows` (by first cell) to keep; `widths`, `row_headers` as above
#   qr          close layout only: [{label, url}]; `url: null` leaves a placeholder

# The look follows the author's PHUSE EU Connect 2025 deck, ML04
# (https://phuse.s3.eu-central-1.amazonaws.com/Archive/2025/Connect/EU/Hamburg/PRE_ML04.pdf),
# in the brand of Evidenze Germany: logo, earth and colours as on evidenze.com
# and on chrestos.de, the former Chrestos, now Evidenze Germany.
brand:
  logo: slides/brand/evidenze-logo.png              # title slide and closing slide, top right
  earth: slides/brand/evidenze-germany-earth.png    # title slide, bottom right
  footer_logo: false                                # a small logo on every other slide
  # Title slide, top left: the conference's own logo from PHUSE's event page, set on
  # the page's blue (see brand/README.md); delete the line to drop it.
  conference_logo: slides/brand/phuse-connect-2026.png
  # The EU icon for AI-generated content, the basic "AI" in a black circle, as the
  # EU published it with its Code of Practice on marking and labelling
  # AI-generated content (see brand/README.md). It goes in the top right corner
  # of every generated image, the Code's own example; delete the line to drop it.
  ai_label: slides/brand/eu-ai-black.png

contact: josua.boeser@evidenze.com                  # title and closing slides, after the name

style:
  fonts:            # Arial as in ML04; both fonts ship with PowerPoint on Windows and macOS
    heading: Arial
    body: Arial
    code: Consolas
  colours:          # hex, no '#'
    heading: "091A40"   # Evidenze navy: titles
    ink: "202536"       # text
    accent: "1D4EBD"    # Evidenze blue: labels, highlighted code, table headers, "Questions"
    brand: "27B564"     # Evidenze green: leaves, bullets, highlight rings, placeholders
    grey: "5F6B7A"      # captions and file paths
    rule: "D5DCE6"      # thin lines, the leaves of mechanisms still to come
    panel: "F3F5F9"     # the card behind the quoted files
    mark: "E4EBF5"      # rows set in bold in a table
    drawing: "000000"   # black, as the drawings' lines: the slide number on the pictures
  tracker: true         # seven leaves in the top right corner of a reference slide, one per mechanism
  picture_corner: right # the slide number on the pictures, in black without a leaf: right or left; false drops it
  # The deck's own motion (since the evening of 2026-10-19): the slides with `transition`
  # fade in, the cards fade in, and the stages of a `build_up` fade into each other. false
  # switches all of it off; the moving GIFs are pictures, and the stages of a build-up and a
  # fix's `steps` are slides, so they stay (the stages since 2026-10-27).
  motion: true

# The names that float above the cast on the story slides, as in a game (the author's
# request, 2026-10-15): the name in the story, and below it, in angle brackets, what it is
# in Claude Code. Steve carries none: he is the player. Since the fourth run-through
# (2026-10-21) a robot carries its name only where it first stands in the room (1.3, 4.3, 5.3), in
# 8.1, where the whole office is named, and at the curtain call in 8.3; beat 6 keeps the
# context window's bar without the words. Objects get `labels` where they first matter
# and all together in 8.1.
#
# Each robot also has a card (the author's request, 2026-10-19), shown once, on the slide
# after the one where it joins the team (`card` on that slide): its portrait, cut from a
# plate of the three robots alone (slides/image-prompts.md), and up to six rows of what it
# can and cannot do. The rows follow the storyline's checked sentences: the worker 1.3, 2.2,
# 7.2 and 7a.1, security 4.3 and 7b.1, the reviewer 5.3 and 6.1. `seconds` is what the card
# adds to the talk (20 unless set), `intention` the first line of its notes.
cast:
  worker:
    name: Worker
    title: Claude Code
    card:
      portrait: slides/beats/card-worker.png
      intention: "Meet the worker: it gets things done, and it forgets."
      # BRAIN names no Claude since the fifth run-through (2026-10-22): the story's maker is the
      # Worker Company; the title and the model below keep the real names.
      rows:
        - [ARMS, "reads, writes, runs commands"]
        - [BRAIN, "at the Worker Company"]
        - [HEAD, "holds this session only"]
        - [MEMORY, "only what is written down"]
        - [WEAK SPOT, "can believe what it reads"]
      # Stats: only values the documentation states (checked on 2026-10-19, Claude Code 2.1.303).
      stats:
        - [MODEL, "Opus 5.5"]
        - [CONTEXT, "1M tokens"]
      stats_note: "Opus 5.5 is the default model on the Pro, Max, Team, Enterprise and API plans, and it runs with a 1M-token context window (Model configuration docs). Say it as the brain: the worker is Claude Code, and its brain is a model, here Opus 5.5; never \"the worker is Opus 5.5\"."
  reviewer:
    name: Reviewer
    title: subagent
    card:
      portrait: slides/beats/card-reviewer.png
      intention: "Meet the reviewer beside the worker: its brain from the same company, no hands, a head of its own."
      # In the worker's order, so the two cards of 5.2 line up row by row (since 2026-10-19).
      rows:
        - [ARMS, "none: it only reads"]
        - [BRAIN, "at the Worker Company too"]
        - [HEAD, "its own, not the worker's"]
        - [EYE, "one, and a big one"]
        - [WEAK SPOT, "sees only what it is given"]
      # The same keys as the worker's, so the two cards of 5.2 compare across. Since 2026-10-20
      # the reviewer names its model, Sonnet 5.5, so the room sees another Claude (the author's
      # request after the third run-through). The repository's own reviewer sets `model: sonnet`:
      # .claude/agents/view-reviewer.md until 2026-10-27, .claude/agents/reference-checker.md since,
      # when the playground left, so the card stays true of the repository.
      stats:
        - [MODEL, "Sonnet 5.5"]
        - [CONTEXT, "its own"]
      stats_note: "A subagent's file can set `model: sonnet`, as this repository's reviewer, the reference checker, does; it resolves to Sonnet 5.5 on the Anthropic API, unless Claude names another model for that one call, and each subagent runs in its own context window (Model configuration and Subagents docs)."
  security:
    name: Security
    title: hook
    card:
      portrait: slides/beats/card-security.png
      intention: "Meet security: it does not think, so it cannot be talked round."
      rows:
        - [BODY, "bolted to the floor"]
        - [BRAIN, "none: a fixed script"]
        - [PADDLE, "says no before a tool runs"]
        - [SEES, "only what it was told to check"]
        - [WEAK SPOT, "misses what it was not told"]
      stats:
        - [EVENTS, "33"]
        - [SAYS NO, "exit code 2"]
        - [TIMEOUT, "600 s"]
      stats_note: "The hooks reference lists 33 events; exit code 2 blocks on the events that can block; a command hook times out after 600 seconds on most events, PreToolUse among them, unless it sets its own `timeout` (Hooks reference)."
  # The threat gets a card too, as a game shows a new enemy (the author's request after the third
  # run-through, 2026-10-20): the planted letter of 7a.1 on a puppeteer's cross, its strings
  # ending in empty loops. No name floats over it; its label is prompt injection. The rows follow
  # the paper's chapter 9, and the stats are what the sources state, not documentation values.
  letter:
    name: Planted letter
    title: prompt injection
    card:
      portrait: slides/beats/card-letter.png
      tag: NEW THREAT
      intention: "Meet the threat: an order planted in text, and it needs hands to pull."
      rows:
        - [COMES IN, "pages, files, notes, data cells"]
        - [LOOKS LIKE, "an order, written for machines"]
        - [PULLS, "any worker with hands"]
        - [NEEDS, "data, outside text, a way out"]
        - [WEAK SPOT, "a reader without hands"]
      stats:
        - [IMMUNE, "no system"]
        - [A LEAK NEEDS, "all three"]
      stats_note: "Anthropic's Security page: \"no system is completely immune to all attacks\". A leak through planted text needs private data in reach, text from outside and a way out together, Willison's lethal trifecta (paper, chapter 9, checked 2026-10-20)."
  # Beat 10 brings in the EU, as a game shows a new rule (the author's request, 2026-10-27, as
  # the secret level until 2026-10-28): the AI Act drawn as a ring of twelve stars with two gloves
  # and a gavel. Its name floats where it comes in, 10.1, with the article it stands for, Art. 14,
  # as the author chose (`<AI Act>` before). The rows follow Article 14(4) of the AI Act, and the
  # stats are what the law's own text says, searched in full on 2026-10-27.
  eu:
    name: EU
    title: Art. 14
    card:
      portrait: slides/beats/card-eu.png
      tag: NEW RULE
      intention: "Meet the rule from outside: for high-risk AI, a person must be able to understand, doubt, override and stop it."
      rows:
        - [HANDS, "two gloves and a gavel"]
        - [WANTS, "a human who oversees"]
        - [THE HUMAN, "understands, doubts, overrides"]
        - [STOP, "a ‘stop’ button or similar"]
        - [WEAK SPOT, "high-risk AI only"]
      stats:
        - ["“HUMAN OVERSIGHT”", "17 times"]
        - ["“IN THE LOOP”", "never"]
        - [APPLIES FROM, "2027 / 2028"]
      stats_note: "Regulation (EU) 2024/1689, the AI Act, says \"human oversight\" 17 times and \"human in the loop\" never, recitals and annexes included (full text searched on 2026-10-27). Article 14 binds high-risk AI only, from 2 December 2027 under Annex III and from 2 August 2028 under Annex I, as Regulation (EU) 2026/1744 set it; its paragraph 4(e) names the 'stop' button."

slides:
  "0.1":
    layout: title
    # The basic icon carries no words, so the title slide says once what it marks.
    ai_legend: "Drawings generated with AI (Nano Banana® 2.1)"
    # The narrated deck speaks in a generated voice, so its line says so (2026-10-28).
    ai_legend_narrated: "Drawings and voice generated with AI"
  # The house at night opens the story, the whole slide (the title slide's small picture
  # until 2026-10-28, the author's request: the story begins as we go into Steve's house).
  "0.2":
    layout: picture
    alt: "A narrow brick house at night, every window black; only the small basement window with its pointed arch glows yellow, a bare bulb inside."
  # The way in, on the speaker's click: the GIF starts as the slide appears (2026-10-28).
  # Its last frame is 1.1, so the deck moves on to 1.1 by itself once it has settled, and
  # the next click brings 1.2 (2026-10-29, the author's request: it took two clicks).
  "0.3":
    layout: picture
    advance: after_gif
    alt: "The view closes in on the house's lit basement window until its yellow light fills the picture; out of that light the basement fades in, where the programmer works alone at his bench."

  # Beat 1 — Alone in the basement
  "1.1":
    layout: picture
    alt: "A man sits hunched on a stool at a workbench late at night under a bare bulb that glows yellow, typing on a laptop and rubbing his tired eyes; behind him a cork board is crowded with sticky notes, a few drifting to the floor; a black book with a red seal stands alone on a wall shelf."
  "1.2":
    layout: picture
    # The banister runs into the top right corner; the label's white rim cuts it
    # just short of the icon, which reads cleanly (looked at on 2026-10-09).
    ai_label: top-right
    card: worker            # Steve orders the one with arms
  "1.3":
    layout: picture
    names:
      - {who: worker, at: [0.611, 0.242]}

  # Beat 2 — The first hire
  "2.1":
    layout: picture
  "2.2":
    layout: picture
  "2.3":
    layout: picture
    labels:
      - {text: AGENTS.md, at: [0.176, 0.235], click: true}

  # Beat 3 — The same briefing every morning
  "3.1":
    layout: picture
  "3.2":
    layout: picture
    transition: fade        # the same camera as 3.1: the arm comes, the eraser goes
    labels:
      - {text: skill, at: [0.48, 0.296], click: true}

  # Beat 4 — Someone wanders into the server room
  "4.1":
    layout: picture
  "4.2":
    layout: picture
  "4.3":
    layout: picture
    alt: "At the bench the worker robot reaches with a feather duster towards the black book with a red seal on its shelf; a guard post bolted to the floor, a peaked cap on top, holds a red paddle up between them, and a low striped barrier with a padlock stands before the shelf."
    names:
      - {who: security, at: [0.5925, 0.296]}
    card: security

  # Beat 5 — Hiring for attributes
  "5.1":
    layout: picture
  "5.2":
    layout: picture
    card: reviewer          # the one he skipped: no arms, no legs, just one big eye
    beside: worker          # its card stands beside the worker's, the rows lined up
  "5.3":
    layout: picture
    names:
      - {who: reviewer, at: [0.731, 0.479]}

  # Beat 6 — Everyone in one meeting room
  # The bar under a name is the context window: the worker's rises through 6.1 until it
  # bursts, and 6.2 lowers it slide by slide, to half at /compact and to a hint at /clear, for
  # the house rules that come back; the reviewer's stays empty, since a subagent has a window
  # of its own.
  "6.1":
    layout: picture
    alt: "At a table buried under stacks of paper, the worker robot sits dizzy with spiral eyes; the gauge beside the window bursts, the stacks topple and sheets fall to the floor, a long receipt curls across it, and the programmer adds another sheet to a stack."
    # The meeting fills up in three stages before the slide itself (the author's idea,
    # 2026-10-19): the stacks grow until they tower over the worker's head, the gauge and the
    # bar rise, and the worker tires. Each stage waits for the speaker's click (since
    # 2026-10-27, the author's request; until then each stood about a second and moved on).
    build_up:
      stages:
        - image: slides/beats/beat-06-context-1a.jpg
          bars: {worker: 0.25}
          alt: "A meeting room: the programmer, in an open robe, hands one more sheet from his stack to the worker robot, which sits upright and bright-eyed at a table with one low stack of paper; the window is clear and the gauge beside it low, and behind a glass door the reviewer robot sits at its own desk."
        - image: slides/beats/beat-06-context-1b.jpg
          bars: {worker: 0.5}
          alt: "The same meeting room: two stacks of paper now stand on the table beside the worker robot, sheets are taped to the window, and the gauge climbs; the programmer hands over another sheet."
        - image: slides/beats/beat-06-context-1c.jpg
          bars: {worker: 0.75}
          alt: "The same meeting room: the stacks tower over the worker robot's head, its eyelids droop, a long receipt curls from the table, more sheets cover the window and the gauge's needle is near the end; the programmer hands over yet another sheet."
    # The last stage bursts (the author's request after the fourth run-through): the gauge
    # cracks and the stacks topple in the picture, and the bar is full and bursts with it.
    names:
      - {who: worker, at: [0.311, 0.441], bar: 1, burst: true, text: false}
      - {who: reviewer, at: [0.851, 0.437], bar: 0, text: false}
    labels:
      - {text: "context\nwindow", at: [0.6975, 0.37]}
  "6.2":
    layout: picture
    alt: "The same room cleared: one folder on the table, the window clear, the gauge low, the recycling bin full, the worker robot upright with bright eyes, and the programmer sitting down with an empty notepad."
    transition: fade        # the same camera as 6.1: the fix fades in
    # The fix shows one state per slide (the author's requests after the fifth run-through,
    # 2026-10-22; for a day the clicks of one slide carried them, and PowerPoint did not play
    # the bar as built): /compact files the stacks into a small, orderly cupboard, bins a few
    # sheets and makes Steve smile, the bar at half; auto-compact takes the place of the context
    # window's label over the gauge, which compacts by itself near the end; /clear, the slide
    # itself, shows the cleared room with nothing left but the next topic's folder, the bar down
    # to a hint for the house rules, and the gauge is the context window again (since 2026-10-28,
    # the author's request). The /compact label goes with the cupboard.
    steps:
      - image: slides/beats/beat-06-context-2a.jpg
        bars: {worker: 0.5}
        alt: "The same meeting room: the stacks are filed into a small cupboard of binders on the table, a few crumpled sheets lie in the bin, the gauge stands at half, the worker robot sits upright with bright eyes and the programmer smiles."
        labels:
          - {text: "context\nwindow", at: [0.6975, 0.37]}
          - {text: /compact, at: [0.47, 0.415]}
      - image: slides/beats/beat-06-context-2a.jpg
        bars: {worker: 0.5}
        alt: "The same meeting room: the stacks are filed into a small cupboard of binders on the table, a few crumpled sheets lie in the bin, the gauge stands at half, the worker robot sits upright with bright eyes and the programmer smiles."
        labels:
          - {text: /compact, at: [0.47, 0.415]}
          - {text: auto-compact, at: [0.6975, 0.37]}
    names:
      - {who: worker, at: [0.311, 0.441], bar: 0.12, text: false}
      - {who: reviewer, at: [0.851, 0.437], bar: 0, text: false}
    labels:
      - {text: "context\nwindow", at: [0.6975, 0.37]}
      - {text: /clear, at: [0.7175, 0.735]}

  # Beat 7 — Overnight the team forgets
  "7.1":
    layout: picture
  "7.2":
    layout: picture
    transition: fade        # the same camera as 7.1: the whiteboard clears, the drawer opens
    labels:
      - {text: "auto\nmemory", at: [0.335, 0.703], click: true}

  # Beat 7a — The post room
  "7a.1":
    layout: picture
    alt: "Through a small pointed window high up, a cartoon villain in a top hat leans out and holds a long letter on a puppeteer's cross; the worker robot at the foot of the stairs looks up and reads it, while three strings run from the letter to one of its arms and pull it towards a bunch of keys on a hook; the programmer, back turned, draws boxes on a whiteboard."
    labels:
