  # Reference — to read after the talk. The sentences on the left are the
  # paper's own (`source: paper/paper.md`); the right-hand cards quote the files.
  "R.1":
    layout: reference
    panel:
      - table:
          header: [In your company, In Claude Code, Where you find it]
          widths: [1.9, 1.9, 4.6]
          bold: [3, 4, 7]   # enforced outside the model
          rows:
            - [Onboarding document, "`CLAUDE.md`", "`CLAUDE.md` at the repository's root"]
            - [Procedure binder, skill, "`.claude/skills/style-review/SKILL.md`"]
            - [Locks and access rights, hook and permission rules, "`.claude/hooks/protect-build-outputs.sh`, `.claude/settings.json`"]
            - [Read-only reviewer, subagent, "`.claude/agents/reference-checker.md`"]
            - [Meeting discipline, context commands, "`/context`, `/compact`, `/clear`, `/usage`"]
            - [Decision log, auto memory, "`/memory` (on the machine, not in the repository)"]
            - [Separate premises, isolation, "a VM, a container or a cloud session"]
      - caption: "The rows in bold hold whatever the model decides. The next seven slides take one row each. Then come untrusted input and data protection. The paper ML19 explains each one. The files named here are the ones this paper and talk were made with."
      - label: start at the repository root
      - shell: claude
      - caption: "Claude Code, the worker in this talk. Start it at the root so the shared settings load."

  "R.2":
    layout: reference
    mechanism: 1
    split: 0.46
    explain:
      - label: what it is
      - text: "It is a Markdown file at the root of your project that Claude Code reads at the start of every session. Think of it as the note you would leave a new colleague, saying where the specs live and what must never be edited. Claude follows it, usually well, but nothing enforces it."
        source: paper/paper.md
      - label: when you need it
      - text: "The second time you type the same correction, write it down."
        source: paper/paper.md
      - label: the case to watch
      - text: '"Do not write to `prod/`" in this file is advice the model usually follows. For production data, *usually* is not good enough. Anything that must never happen needs a hook (chapter 4).'
        source: paper/paper.md
      - caption: "Paper ML19, chapter 2"
    panel:
      # The rules this paper and talk were written under (since 2026-10-27, when the playground
      # left the repository): the start of the root CLAUDE.md, which changes least.
      - file: CLAUDE.md
        lines: "23-37"
        reflow: true
        highlight: ["Every artefact is English", "British English"]
        expect: ["## 1. Language", "Every artefact is English", "## 2. Spelling and style", "British English", "No marketing language"]
      - caption: "This repository's own rules, read at the start of every session; `/context` lists the file. A subfolder's `CLAUDE.md` loads when Claude reads, writes or edits a file there."

  "R.3":
    layout: reference
    mechanism: 2
    split: 0.44
    explain:
      - label: what it is
      - text: "A skill is a standard operating procedure in file form. It lives in `.claude/skills/<name>/SKILL.md` and is loaded only when needed. You call it by starting your message with a slash and its name. Claude also loads a skill unasked when it judges that the skill's description fits your request. Until then only that description sits in the context window (everything Claude can see at once)."
        source: paper/paper.md
      - label: when you need it
      - text: "The third time you explain the same multi-step procedure, write it down as a skill."
        source: paper/paper.md
      - label: the case to watch
      - text: "A skill that edits what it was asked to check is not a review. `allowed-tools` blocks nothing. List `Edit`, `Write`, `NotebookEdit`, `Bash`, `PowerShell` and `Monitor` under `disallowed-tools`, since commands write files too. Or give the check to a read-only subagent (chapter 5)."
        source: paper/paper.md
      - caption: "Paper ML19, chapter 3"
    panel:
      - file: .claude/skills/style-review/SKILL.md
        lines: "1-7"
        label: header (front matter)
        highlight: ["description:", "disallowed-tools:"]
        expect: ["description:", "disallowed-tools: Edit Write"]
      - file: .claude/skills/style-review/SKILL.md
        lines: "53-53"
        reflow: true
        highlight: ["Report, do not repair."]
        expect: ["Report, do not repair."]
      - code: /style-review 4

  "R.4":
    layout: reference
    mechanism: 3
    split: 0.5
    explain:
      - label: what it is
      - text: "A hook is a small script that Claude Code runs at a fixed moment, for example just before it writes a file. The script sees what is about to happen and can say no."
        source: paper/paper.md
      # literal since the paper's chapter 4 shows the tool call as a diagram
      - table:
          header: ["", "`CLAUDE.md` rule", "Permission rule", "Hook"]
          rows:
            - [Relies on, the model, Claude Code, Claude Code]
            - [Can block, "no", "yes, deny rules come first", "yes, exit code 2"]
          row_headers: true
          widths: [1.0, 1.2, 1.7, 1.2]
      - label: when you need it
      - text: "Wherever a wrong action is expensive or hard to reverse: production data, released reports, generated files, anything under change control."
        source: paper/paper.md
      - label: the case to watch
      - text: "An untested guardrail may not work at all. By default, a hook that fails or times out lets the call through, and a mistyped path is enough. Set `onFailure: \"block\"` on every guarding hook."
        source: paper/paper.md
      - caption: "Paper ML19, chapter 4"
    panel:
      # The hook that keeps hand edits out of the generated deck and paper, with its message
      # to Claude left out (since 2026-10-27, when the playground's production hook left).
      - file: .claude/hooks/protect-build-outputs.sh
        lines: ["23-25", "27-28"]
        highlight: ["exit 2"]
        expect: ["Edit|Write)", "/out/", "exit 2"]
      - file: .claude/settings.json
        lines: ["8-9", "15-25"]
        highlight: ["\"Edit(/out/**)\"", "\"PreToolUse\"", "\"onFailure\": \"block\""]
        expect: ["\"deny\": [", "Edit(/out/**)", "\"PreToolUse\"", "protect-build-outputs.sh", "\"onFailure\": \"block\""]
      - caption: "Exit code 2 blocks; so does a failing hook with `onFailure: \"block\"`."

  "R.5":
    layout: reference
    mechanism: 4
    split: 0.46
    explain:
      - label: what it is
      - text: "A subagent is a second Claude that the first one hands a task to. It has its own context window (everything it can see at once, chapter 6), instructions, tool list and permissions. It starts from a task, not from your conversation, and returns a summary."
        source: paper/paper.md
      - text: "Each subagent you write is one Markdown file under `.claude/agents/`."
        source: paper/paper.md
      - label: when you need it
      - text: "A second pair of eyes that cannot change anything. Such a reviewer reads the output, the spec and the source data, and only reports."
        source: paper/paper.md
      - label: the case to watch
      - text: "The reviewer is a fresh pair of eyes, not an independent one. Where a review must be independent, have a person or a second program do it."
        source: paper/paper.md
      - text: "Read its tool list before you trust its verdict: a subagent that can edit files may repair what it finds instead of reporting it."
        source: paper/paper.md
      - caption: "Paper ML19, chapter 5"
    panel:
      - file: .claude/agents/reference-checker.md
        lines: "1-6"
        label: front matter
        highlight: ["tools: Read, WebFetch", "model: sonnet"]
        expect: ["tools: Read, WebFetch", "model: sonnet"]
      - file: .claude/agents/reference-checker.md
        lines: "18-19"
        reflow: true
        highlight: ["Do not edit any file."]
        expect: ["Do not edit any file."]
      - text: "Type `@` and pick **reference-checker**."

  "R.6":
    layout: reference
    mechanism: 5
    split: 0.42
    explain:
      - label: what it is
      - text: "The context window is everything Claude can see at once. Every file Claude reads, every command output and every reply lands there. It is finite and measured in tokens (small units of text, a few characters each)."
        source: paper/paper.md
      - label: when you need it
      - text: "Sooner or later a long session gets vague, or the bill surprises you."
        source: paper/paper.md
      - label: the case to watch
      - text: "Do not `/clear` halfway through a task whose progress is not yet written down. The new conversation starts from the files alone, unless you `/resume` the old one."
        source: paper/paper.md
      - caption: "Paper ML19, chapter 6"
    panel:
      - table_from:
          file: paper/paper.md
          header: [Command, What it does, Use it]
          columns: [Command, What it does, Use it]
          rows: ["`/context`", "`/compact focus on …`", "`/clear`", "`/usage`"]
          widths: [1.7, 2.3, 2.1]
      - caption: "After `/clear`, the root `CLAUDE.md` is reloaded at once, a subfolder's `CLAUDE.md` when Claude next uses a file there; the conversation is saved for `/resume`."

  "R.7":
    layout: reference
    mechanism: 6
    split: 0.44
    explain:
      - label: what it is
      - text: "A new session starts without the last conversation unless you `/resume` it."
        source: paper/paper.md
      - text: "Two things carry over on their own: what you wrote in `CLAUDE.md` (chapter 2), and *auto memory*, the notes Claude writes for itself. The notes are Markdown files kept per repository, one per memory, and Claude reads their index at the start of every session."
        source: paper/paper.md
      - label: when you need it
      - text: "Monday morning, and you re-explain last week's decisions to the assistant."
        source: paper/paper.md
      - label: the case to watch
      - text: "Memory is not the spec. A decision that others rely on belongs in the spec or in `CLAUDE.md` as well, versioned and reviewed."
        source: paper/paper.md
      - caption: "Paper ML19, chapter 7"
    panel:
      - label: a request, as typed
      - text: "*“Remember that durations in days count the first and the last day, because the data owner asked for it.”*"
      - code: /memory
      - table_from:
          file: paper/paper.md
          header: ["", "`CLAUDE.md`", "Auto memory"]
          columns: ["", "`CLAUDE.md`", "Auto memory"]
          rows: [Who writes it, Contains, Loaded]
          row_headers: true
          widths: [1.2, 2.0, 2.6]
      - caption: "A cloud session (chapter 8) starts on a fresh machine, so what auto memory writes there does not reach the next session."
        source: paper/paper.md

  "R.8":
    layout: reference
    mechanism: 7
    split: 0.47
    explain:
      - label: what it is
      - text: "Isolation changes what is within reach. The assistant works in a closed environment with no path to your own systems: a virtual machine (VM), a container or a cloud session."
        source: paper/paper.md
      - text: "One rule makes the rest simple: the assistant writes the program, and the program touches the data."
        source: paper/paper.md
      - label: when you need it
      - text: "Before your first session on a project, and before you open a repository you did not write (chapter 9)."
        source: paper/paper.md
      - text: "Whenever real data or your own keys sit within reach, as on most laptops."
        source: paper/paper.md
      - text: "The flag `--dangerously-skip-permissions` turns the permission prompts off. It is meant only for \"isolated environments like containers or VMs\"."
        source: paper/paper.md
      - label: the case to watch
      - text: "Never switch the permission prompts off on your own machine: only in a container or VM, and not as root."
        source: paper/paper.md
      - caption: "Paper ML19, chapter 8"
    panel:
      - bullets:
          - "**VM or container:** a user of its own, not root; an access token that opens one repository and expires; `--dangerously-skip-permissions` only in here."
          - "**Cloud session:** the GitHub App installed on this repository only; no `/web-setup`, whose token reaches every repository it can access; `main` protected by a GitHub branch rule your access cannot bypass, because the session can push to any branch your access allows."
          - "**Both:** synthetic data only."
      - code: /sandbox
      - caption: "Confines the commands Claude runs, not Claude Code itself; those commands can still read your disk."

  # Safety is no eighth mechanism but the seven applied to one threat, so R.9 lights no leaf.
  "R.9":
    layout: reference
    split: 0.54
    explain:
      - label: what it is
      - text: "Claude reads a great deal that you did not write, from web pages to free-text cells in a dataset. Text planted there to look like an order is a prompt injection, which Claude can mistake for your instructions."
        source: paper/paper.md
      - text: "A supply-chain attack poisons something you pull in, such as a package or an MCP server (a program that gives Claude extra tools)."
        source: paper/paper.md
      - label: when you need it
      - text: "Whenever Claude reads or installs something you did not write. A leak through planted text needs three things together, the lethal trifecta:"
        source: paper/paper.md
      - bullets:
          - "private data in reach (chapter 8 keeps it out of reach)"
          - "text from outside (this chapter)"
          - "a way out (chapters 4 and 8 close it)"
      - text: "Take one away."
        source: paper/paper.md
      - label: the case to watch
      - text: "The dangerous case is all three at once: private data in reach, a vendor PDF to read and `git push` open. No defence is complete. Remove one."
        source: paper/paper.md
      - caption: "Paper ML19, chapter 9"
    panel:
      # literal since the paper's chapter 9 shows the trifecta as a diagram
      - table:
          header: [Way in or out, What to do, What holds]
          rows:
            - ["A web page, a PDF, a vendor note", "Save it, then have a subagent read it with no shell, web, write or MCP tools", "its tool list; its report is outside text"]
            - ["A way out: network, `git push`, an MCP tool that posts", "Deny `WebFetch`, `curl` and `wget`. Sandbox, in managed settings or with `--settings`: no allowed domains, `strictAllowlist` on, no retries outside it", "the sandbox for commands, deny rules for `WebFetch` and MCP"]
            - ["Packages and install scripts", "Commit the lockfile, which fixes every version. Install only in a closed environment", "the lockfile and your review"]
            - ["MCP servers, plugins, skills", "Treat each as software you install: read it, pin its version, allow only what you need", "managed settings, which your organisation sets"]
          widths: [1.6, 2.8, 1.8]
      # literal since the playground's unattended review left the repository (2026-10-27)
      - code: |-
          claude -p "Summarise vendor-note.pdf" \
            --tools "Read,Grep,Glob" \
            --disallowedTools "mcp__*"
      - caption: "A reader without hands. `--tools` leaves only reading, but does not touch MCP tools, so `--disallowedTools` removes those too."

  # Data protection is no mechanism either: the seven applied to personal data and
  # to the dependence on one vendor (paper chapter 10), so R.10 lights no leaf.
  "R.10":
    layout: reference
    split: 0.42
    explain:
      - label: what it is
      - text: "With Claude Code you need not even paste. Your prompts and every file Claude reads go to the model provider."
        source: paper/paper.md
      - text: "Under the EU's GDPR, pseudonymised data stays personal data for anyone who can reasonably link it back to a person. Health data is also a special category, so pseudonymised health data falls under both."
        source: paper/paper.md
      - label: when you need it
      - text: "One day, someone pastes real data into a chatbot to fix one line of code."
        source: paper/paper.md
      - text: "There is a second thing you hand over: control."
        source: paper/paper.md
      - label: the case to watch
      - text: "Never let data about real people into a session (chapter 8), least of all on a personal account. Its consumer terms are not your company's commercial terms."
        source: paper/paper.md
      - caption: "Paper ML19, chapter 10"
    panel:
      - table_from:
          file: paper/paper.md
          header: [Question, What to look for]
          columns: [Question, What to look for]
          rows: ["Which account?", "Training on your sessions?", "Kept for how long?", "Processed where?", "Copies on your disk?"]
          widths: [1.5, 4.5]
      - label: a deny rule, in .claude/settings.local.json
      - code: |-
          { "permissions": { "deny":
              ["Read(/data/people/**)"] } }
      - caption: "Stops Claude's file tools, not a script that opens the file itself. `/sandbox`, with no unsandboxed retries, stops that too: it takes in the `Read(...)` deny paths."
      - code: DISABLE_FEEDBACK_COMMAND=1
      - caption: "Keeps `/feedback`, `/bug` and `/share` from sending the session, code included; Anthropic keeps such reports five years."

  "R.11":
    layout: reference
    panel:
      - text: "One task, all seven mechanisms: you add a duration in days, from start to end, to a report program."
        source: paper/paper.md
      - table_from:
          file: paper/paper.md
          header: [Step, What happens, Mechanism, What it prevents]
          columns: [Step, What happens, Mechanism, What it prevents]
          rows: ["0", "1", "2", "3", "4", "5", "6", "7"]
          widths: [0.45, 5.2, 1.3, 3.1]
      - text: "The steps that must hold (0, 3 and 5) do not depend on the model behaving well."
        source: paper/paper.md

  "R.12":
    layout: reference
    explain:
      - label: 4.3 · approving prompts
      - text: "Manual prompts … in practice users accept 93% of them anyway."
        source: slides/storyline.md
      - caption: 'Anthropic (John Hughes). "How we built Claude Code auto mode: a safer way to skip permissions" (engineering blog, 2026). https://www.anthropic.com/research/claude-code-auto-mode (accessed 2026-10-28).'
        source: paper/references.md
      - label: 7a.2 · what a leak needs
      - text: "A leak through planted text needs three things: private data in reach, text from outside, a way out."
        source: slides/storyline.md
      - caption: 'Simon Willison. "The lethal trifecta for AI agents: private data, untrusted content, and external communication" (blog post, 2025). https://simonwillison.net/2025/Jun/16/the-lethal-trifecta/ (accessed 2026-10-28).'
        source: paper/references.md
      - label: 7c.1, 7c.2 · what the maker keeps
      - text: "Into the Worker Company's warehouse: on a personal plan that allows training, for five years."
        source: slides/storyline.md
      - text: "From the office only practice data leaves, on the company's plan: kept thirty days, not used for training."
        source: slides/storyline.md
      - caption: 'Anthropic. "Data usage". https://code.claude.com/docs/en/data-usage (accessed 2026-10-28).'
        source: paper/references.md
      - label: 8.2 · what AI amplifies
      - text: "AI doesn't fix a team; it amplifies what's already there."
        source: slides/storyline.md
      # DORA left the paper's reference list on 2026-10-27, so this caption
      # is checked against no file; paper/further-reading.md keeps the source.
      - caption: 'Google Cloud. "Announcing the 2025 DORA Report: State of AI-Assisted Software Development" (blog post, 2025). https://cloud.google.com/blog/products/ai-machine-learning/announcing-the-2025-dora-report (accessed 2026-10-28).'
