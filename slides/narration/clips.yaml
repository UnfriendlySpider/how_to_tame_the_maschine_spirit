# The narrated deck: which stretch of which take each slide plays (the author's request,
# 2026-10-21). `uv run python tools/build_slides.py --narrated` cuts the clips from the takes in
# takes/ and builds out/PRE_<number>-narrated.pptx, which plays by itself: each slide plays its
# clip, then moves on.
#
# A slide is named as the deck names it: its id, "<id> card" for the card after a robot's first
# entrance, "<id> stage <n>" for a stage of a build-up, "<id> step <n>" for a step of a fix. Each
# clip is a list of pieces, played in order with a paragraph pause between them; a piece is a
# whole take, or the stretch of a take from the first words of `from` to the last of `to`,
# written exactly as in script.md, tags left out. Across a take the pieces follow each other
# without a gap or an overlap, and tools/check_sources.py checks that they cover every word.
#
# `cues` names the spoken word at which a label pops up, by the label's text in deck.yaml;
# `rings` would name the word for a slide's waiting rings. A label without a cue pops up as the
# slide begins. `hold` is how long a slide without a clip stays, in seconds; the last slide stays
# until the show is ended.

pause: 0.7          # seconds between pieces, as between paragraphs in the joined narration
lead: 0.4           # silence before a clip, while the slide fades in
tail: 0.8           # silence after it, before the slide moves on

